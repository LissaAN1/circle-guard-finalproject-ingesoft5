name: circleguard-sonarqube

services:
  database:
    image: postgres:16.10
    container_name: circleguard-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?set SONAR_DB_PASSWORD in the remote secrets file}
    volumes:
      - sonarqube_postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - sonar_internal

  sonarqube:
    image: sonarqube:25.6.0.109173-community
    container_name: circleguard-sonarqube
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://database:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?set SONAR_DB_PASSWORD in the remote secrets file}
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    networks:
      - sonar_internal

volumes:
  sonarqube_postgresql:
    name: circleguard_sonar_postgresql
  sonarqube_data:
    name: circleguard_sonar_data
  sonarqube_extensions:
    name: circleguard_sonar_extensions
  sonarqube_logs:
    name: circleguard_sonar_logs

networks:
  sonar_internal:
    name: circleguard_sonar_internal
