# HU-17 / PI-132 - Alertmanager. El destino de notificacion se lee de un archivo (nunca en el repo).
route:
  receiver: team-webhook
  group_by: [alertname, application]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 30m
receivers:
  - name: team-webhook
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/webhook_url   # compatible con NOTIFY_WEBHOOK_URL (Slack/Teams/etc.)
        send_resolved: true
