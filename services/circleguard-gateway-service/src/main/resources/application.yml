spring:
  application:
    name: circleguard-gateway-service
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}

jwt:
  secret: ${JWT_SECRET:}
  expiration: 3600000

qr:
  secret: ${QR_SECRET:}
  expiration: 300

server:
  port: 8087

circleguard:
  features:
    # HU-15: feature toggle read from the environment. In Kubernetes FEATURE_DENY_SUSPECT_ENTRY comes from
    # the ConfigMap circleguard-config. true = SUSPECT and PROBABLE users are denied entry (HU-07 policy).
    deny-suspect-entry: ${FEATURE_DENY_SUSPECT_ENTRY:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

# HU-15: /actuator/info shows the active toggles, to check a ConfigMap change took effect.
info:
  features:
    deny-suspect-entry: ${circleguard.features.deny-suspect-entry}
