apiVersion: apps/v1
kind: Deployment
metadata:
  name: promotion
  labels:
    app.kubernetes.io/name: promotion
    app.kubernetes.io/part-of: circleguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: promotion
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promotion
        app.kubernetes.io/part-of: circleguard
    spec:
      containers:
        - name: promotion
          image: circleguard-promotion-service
          ports:
            - name: http
              containerPort: 8088
          env:
            - {name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/circleguard_promotion"}
            - {name: SPRING_DATASOURCE_USERNAME, valueFrom: {secretKeyRef: {name: circleguard-secrets, key: DB_USER}}}
            - {name: SPRING_DATASOURCE_PASSWORD, valueFrom: {secretKeyRef: {name: circleguard-secrets, key: DB_PASSWORD}}}
            - {name: SPRING_NEO4J_URI, value: "bolt://neo4j:7687"}
            - {name: SPRING_NEO4J_AUTHENTICATION_USERNAME, value: "neo4j"}
            - {name: SPRING_NEO4J_AUTHENTICATION_PASSWORD, valueFrom: {secretKeyRef: {name: circleguard-secrets, key: NEO4J_PASSWORD}}}
            - {name: NEO4J_PASSWORD, valueFrom: {secretKeyRef: {name: circleguard-secrets, key: NEO4J_PASSWORD}}}
            - {name: SPRING_KAFKA_BOOTSTRAP_SERVERS, value: "kafka:9092"}
            - {name: SPRING_DATA_REDIS_HOST, value: "redis"}
            - {name: SPRING_DATA_REDIS_PORT, value: "6379"}
            - {name: SPRING_DATA_REDIS_PASSWORD, valueFrom: {secretKeyRef: {name: circleguard-secrets, key: REDIS_PASSWORD}}}
            - {name: REDIS_PASSWORD, valueFrom: {secretKeyRef: {name: circleguard-secrets, key: REDIS_PASSWORD}}}
            - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: circleguard-secrets, key: JWT_SECRET}}}
          readinessProbe:
            httpGet: {path: /actuator/health, port: http}
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /actuator/health, port: http}
            initialDelaySeconds: 150
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: promotion
  labels:
    app.kubernetes.io/name: promotion
    app.kubernetes.io/part-of: circleguard
spec:
  selector:
    app.kubernetes.io/name: promotion
  ports:
    - name: http
      port: 8088
      targetPort: http
