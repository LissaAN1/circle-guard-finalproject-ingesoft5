# HU-23: Linkerd service mesh installed through the HelmChart resource of k3s (no helm on the workstation).
# install.sh creates the identity issuer Secret from infra/mesh/.private and fills in the public trust anchor below.
# Requests are tiny on purpose: the dev node has 2 vCPU and almost all of them are already reserved by other pods.
apiVersion: v1
kind: Namespace
metadata:
  name: linkerd
  annotations:
    linkerd.io/inject: disabled
  labels:
    linkerd.io/is-control-plane: "true"
    config.linkerd.io/admission-webhooks: disabled
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: linkerd-crds
  namespace: kube-system
spec:
  repo: https://helm.linkerd.io/edge
  chart: linkerd-crds
  version: 2026.11.2
  targetNamespace: linkerd
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: linkerd-control-plane
  namespace: kube-system
spec:
  repo: https://helm.linkerd.io/edge
  chart: linkerd-control-plane
  version: 2026.11.2
  targetNamespace: linkerd
  valuesContent: |-
    identityTrustAnchorsPEM: |
      __TRUST_ANCHOR__
    identity:
      issuer:
        scheme: kubernetes.io/tls
    controllerReplicas: 1
    enablePodDisruptionBudget: false
    proxy:
      resources:
        cpu: {request: 2m}
        memory: {request: 16Mi, limit: 128Mi}
    proxyInit:
      resources:
        cpu: {request: 1m}
        memory: {request: 8Mi}
    destinationResources:
      cpu: {request: 5m}
      memory: {request: 32Mi}
    identityResources:
      cpu: {request: 5m}
      memory: {request: 16Mi}
    proxyInjectorResources:
      cpu: {request: 5m}
      memory: {request: 16Mi}
    heartbeatResources:
      cpu: {request: 1m}
      memory: {request: 8Mi}
