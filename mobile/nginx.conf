server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Runtime configuration generated when the container starts.
    # The same image is reused in dev, stage and prod.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Actuator health endpoints are internal Compose probes.
    # They must not be exposed through the public web proxy.
    location ~ ^/(auth|identity|promotion|form|gateway)/actuator/ {
        return 404;
    }

    # Core backend services deployed by HU-02.
    location /auth/ {
        proxy_pass http://auth:8180/;
        proxy_set_header Host $host;
    }

    location /identity/ {
        proxy_pass http://identity:8083/;
        proxy_set_header Host $host;
    }

    location /promotion/ {
        proxy_pass http://promotion:8088/;
        proxy_set_header Host $host;
    }

    location /form/ {
        proxy_pass http://form:8086/;
        proxy_set_header Host $host;
    }

    location /gateway/ {
        proxy_pass http://gateway:8087/;
        proxy_set_header Host $host;
    }

    # Part 2 services are intentionally not deployed by HU-02.
    location ~ ^/(dashboard|file|notification)/ {
        return 503;
    }

    # Expo Web SPA.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
