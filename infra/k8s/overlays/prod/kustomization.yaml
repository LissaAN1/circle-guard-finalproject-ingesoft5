apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: circleguard-prod

resources:
  - namespace.yaml
  - ../../base

# Registry and version are set by deploy.sh at deploy time, never committed.
configMapGenerator:
  - name: circleguard-config
    behavior: merge
    literals:
      - APP_CORS_ALLOWED_ORIGINS=http://localhost:8080
    options:
      disableNameSuffixHash: true
patches:
  - target: {kind: Deployment, name: auth}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target: {kind: Deployment, name: identity}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target: {kind: Deployment, name: promotion}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target: {kind: Deployment, name: form}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target: {kind: Deployment, name: gateway}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target: {kind: Deployment, name: dashboard}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target: {kind: Deployment, name: file}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target: {kind: Deployment, name: notification}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target: {kind: Deployment, name: web}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
