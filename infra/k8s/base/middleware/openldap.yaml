apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openldap
  labels:
    app.kubernetes.io/name: openldap
    app.kubernetes.io/part-of: circleguard
spec:
  serviceName: openldap
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openldap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openldap
        app.kubernetes.io/part-of: circleguard
    spec:
      containers:
        - name: openldap
          image: osixia/openldap:1.5.0
          ports:
            - name: main
              containerPort: 389
          env:
            - {name: LDAP_ORGANISATION, value: "CircleGuard"}
            - {name: LDAP_DOMAIN, value: "circleguard.edu"}
            - {name: LDAP_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: circleguard-secrets, key: LDAP_ADMIN_PASSWORD}}}
          volumeMounts:
            - name: data
              mountPath: /var/lib/ldap
          readinessProbe:
            tcpSocket: {port: main}
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 12
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 256Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: openldap
  labels:
    app.kubernetes.io/name: openldap
    app.kubernetes.io/part-of: circleguard
spec:
  selector:
    app.kubernetes.io/name: openldap
  ports:
    - name: main
      port: 389
      targetPort: main
