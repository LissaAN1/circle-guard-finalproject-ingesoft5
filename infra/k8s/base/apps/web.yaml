apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: circleguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: circleguard
    spec:
      containers:
        - name: web
          image: circleguard-web
          ports:
            - name: http
              containerPort: 8080
          env:
            - {name: AUTH_BASE_URL, value: "/auth"}
            - {name: IDENTITY_BASE_URL, value: "/identity"}
            - {name: PROMOTION_BASE_URL, value: "/promotion"}
            - {name: FORM_BASE_URL, value: "/form"}
            - {name: GATEWAY_BASE_URL, value: "/gateway"}
            - {name: DASHBOARD_BASE_URL, value: "/dashboard"}
            - {name: FILE_BASE_URL, value: "/file"}
            - {name: NOTIFICATION_BASE_URL, value: "/notification"}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 70
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: "500m", memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: circleguard
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
