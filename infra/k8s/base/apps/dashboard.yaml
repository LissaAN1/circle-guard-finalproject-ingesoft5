apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: circleguard
spec:
  # No fixed replicas: the HorizontalPodAutoscaler of this service owns the count.
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
        app.kubernetes.io/part-of: circleguard
    spec:
      containers:
        - name: dashboard
          image: circleguard-dashboard-service
          ports:
            - name: http
              containerPort: 8084
          env:
            - {name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/circleguard_dashboard"}
            - {name: SPRING_DATASOURCE_USERNAME, valueFrom: {secretKeyRef: {name: circleguard-secrets, key: DB_USER}}}
            - {name: SPRING_DATASOURCE_PASSWORD, valueFrom: {secretKeyRef: {name: circleguard-secrets, key: DB_PASSWORD}}}
            - {name: CIRCLEGUARD_PROMOTIONSERVICE_URL, value: "http://promotion:8088"}
          startupProbe:
            httpGet: {path: /actuator/health, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /actuator/health, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /actuator/health, port: http}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/part-of: circleguard
spec:
  selector:
    app.kubernetes.io/name: dashboard
  ports:
    - name: http
      port: 8084
      targetPort: http
