# HU-14: resilience of the auth -> identity call (login needs the anonymous id).
# Imported from application.yml; the tests import this same file, so they verify these exact values.
# Every value can be overridden per environment with an environment variable (relaxed binding), e.g.
# RESILIENCE4J_CIRCUITBREAKER_INSTANCES_IDENTITY_WAITDURATIONINOPENSTATE=30s
identity:
  http:
    connect-timeout: ${IDENTITY_CONNECT_TIMEOUT:2s}
    read-timeout: ${IDENTITY_READ_TIMEOUT:3s}

resilience4j:
  circuitbreaker:
    instances:
      identity:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        # The rate is evaluated only after 5 calls, so a single failure never opens the circuit.
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        # Calls slower than the read timeout already fail; 2 s marks degraded responses as slow.
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        # Only infrastructure failures count; a 4xx is a caller error, not an unhealthy identity-service.
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
  retry:
    instances:
      identity:
        # 1 call + 2 retries. POST /identities/map is idempotent (same identity -> same anonymous id).
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
