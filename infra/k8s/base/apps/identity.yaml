apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: circleguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity
        app.kubernetes.io/part-of: circleguard
    spec:
      containers:
        - name: identity
          image: circleguard-identity-service
          ports:
            - name: http
              containerPort: 8083
          env:
            - {name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/circleguard_identity"}
            - {name: SPRING_DATASOURCE_USERNAME, valueFrom: {secretKeyRef: {name: circleguard-secrets, key: DB_USER}}}
            - {name: SPRING_DATASOURCE_PASSWORD, valueFrom: {secretKeyRef: {name: circleguard-secrets, key: DB_PASSWORD}}}
            - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: circleguard-secrets, key: JWT_SECRET}}}
            - {name: VAULT_SECRET, valueFrom: {secretKeyRef: {name: circleguard-secrets, key: VAULT_SECRET}}}
            - {name: VAULT_SALT, valueFrom: {secretKeyRef: {name: circleguard-secrets, key: VAULT_SALT}}}
            - {name: VAULT_HASH_SALT, valueFrom: {secretKeyRef: {name: circleguard-secrets, key: VAULT_HASH_SALT}}}
          readinessProbe:
            httpGet: {path: /actuator/health, port: http}
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /actuator/health, port: http}
            initialDelaySeconds: 150
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: identity
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: circleguard
spec:
  selector:
    app.kubernetes.io/name: identity
  ports:
    - name: http
      port: 8083
      targetPort: http
