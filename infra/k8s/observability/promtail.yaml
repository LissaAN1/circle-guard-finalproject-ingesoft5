apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: circleguard-observability
---
# Mínimo privilegio: solo lectura de pods dentro de su propio namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: promtail
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: circleguard-observability
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: promtail
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: circleguard-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: __NAMESPACE__
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: circleguard-observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: promtail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promtail
        app.kubernetes.io/part-of: circleguard-observability
    spec:
      serviceAccountName: promtail
      # Excepción justificada a runAsNonRoot: los logs de /var/log/pods son de root.
      securityContext:
        runAsUser: 0
      containers:
        - name: promtail
          image: grafana/promtail:3.0.0
          args:
            - -config.file=/etc/promtail/promtail.yaml
          ports:
            - name: http
              containerPort: 9080
          volumeMounts:
            - {
                name: config,
                mountPath: /etc/promtail/promtail.yaml,
                subPath: promtail-config.yaml,
                readOnly: true,
              }
            - { name: pods, mountPath: /var/log/pods, readOnly: true }
            - { name: positions, mountPath: /run/promtail }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: config
          configMap: { name: promtail-config }
        - name: pods
          hostPath: { path: /var/log/pods }
        - name: positions
          emptyDir: {}
