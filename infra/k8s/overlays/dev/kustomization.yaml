apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: circleguard-dev

resources:
  - namespace.yaml
  - ../../base

# Registry and version are set by deploy.sh at deploy time, never committed.
configMapGenerator:
  - name: circleguard-config
    behavior: merge
    literals:
      - APP_CORS_ALLOWED_ORIGINS=http://localhost:8080,http://127.0.0.1:8780
      # HU-15: feature toggle of the gateway. true = SUSPECT/PROBABLE users are denied entry.
      # Change it here (or with kubectl edit) and restart the gateway: no new image is needed.
      - FEATURE_DENY_SUSPECT_ENTRY=true
    options:
      disableNameSuffixHash: true

patches:
  # HU-23: the Linkerd proxy is injected into every Deployment of dev (the databases and brokers stay out of the mesh).
  # Without Linkerd installed the annotation is ignored. Requests are tiny: the dev node has 2 vCPU.
  - target: {kind: Deployment}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: any
      spec:
        template:
          metadata:
            annotations:
              linkerd.io/inject: enabled
              config.linkerd.io/proxy-cpu-request: 2m
              config.linkerd.io/proxy-memory-request: 16Mi
  # The dev node has 2 vCPU and its pods already request about 98% of them, so a rolling update cannot start an extra
  # pod per Deployment (the default maxSurge of 25% rounds up to one): the new pods stay Pending with "Insufficient cpu"
  # and the rollout hits its progress deadline. Replace the pod in place instead. A short pause per app is fine in dev.
  - target: {kind: Deployment}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: any
      spec:
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
  # Autoscaling bounds of the dev environment for every HPA.
  - target: {kind: HorizontalPodAutoscaler}
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  # The Traefik middleware annotation needs the namespace of the environment.
  - target: {kind: Ingress, name: circleguard-gateway}
    patch: |-
      - op: replace
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares
        value: circleguard-dev-strip-gateway@kubernetescrd
  # Both publicly reachable routes require a hostname and the same TLS Secret.
  - target: {kind: Ingress, name: circleguard-web}
    patch: |-
      - op: replace
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.entrypoints
        value: websecure
      - op: add
        path: /spec/rules/0/host
        value: dev.circleguard.test
      - op: add
        path: /spec/tls
        value:
          - hosts: [dev.circleguard.test]
            secretName: circleguard-ingress-tls
  - target: {kind: Ingress, name: circleguard-gateway}
    patch: |-
      - op: replace
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.entrypoints
        value: websecure
      - op: add
        path: /spec/rules/0/host
        value: dev.circleguard.test
      - op: add
        path: /spec/tls
        value:
          - hosts: [dev.circleguard.test]
            secretName: circleguard-ingress-tls
  # Temporary DEV mitigation: the LDAP Actuator health indicator returns 503
  # even though the administrative LDAP bind succeeds.
  # Keep LDAP authentication enabled; disable only this health indicator.
  # Remove after the underlying LDAP health-check issue is fixed.
  - target: {kind: Deployment, name: auth}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MANAGEMENT_HEALTH_LDAP_ENABLED
          value: "false"
