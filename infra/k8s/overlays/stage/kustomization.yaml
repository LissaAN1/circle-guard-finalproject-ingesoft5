apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: circleguard-stage

resources:
  - namespace.yaml
  - ../../base

# Registry and version are set by deploy.sh at deploy time, never committed.
configMapGenerator:
  - name: circleguard-config
    behavior: merge
    literals:
      - APP_CORS_ALLOWED_ORIGINS=http://localhost:8080
    options:
      disableNameSuffixHash: true
