spring:
  application:
    name: circleguard-dashboard-service
  config:
    # HU-14: Circuit Breaker and Retry settings for the promotion-service client.
    import: classpath:resilience4j.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/circleguard_dashboard
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8084
