server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La configuracion de URLs se genera al arrancar el contenedor (misma imagen en dev/stage/prod)
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}