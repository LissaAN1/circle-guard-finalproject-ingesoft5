apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: file
  labels:
    app.kubernetes.io/name: file
    app.kubernetes.io/part-of: circleguard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: file
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - {type: Pods, value: 2, periodSeconds: 30}
    scaleDown:
      stabilizationWindowSeconds: 180
