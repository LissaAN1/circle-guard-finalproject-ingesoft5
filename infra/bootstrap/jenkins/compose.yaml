name: circleguard-jenkins

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: circleguard/jenkins-bootstrap:1.0.0
    container_name: circleguard-jenkins
    restart: unless-stopped

    ports:
      - "8080:8080"

    env_file:
      - /opt/circleguard/jenkins/jenkins.secrets.env

    environment:
      CASC_JENKINS_CONFIG: /etc/jenkins/casc.yaml
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false

    volumes:
      - jenkins_home:/var/jenkins_home
      - ./casc.yaml:/etc/jenkins/casc.yaml:ro

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/login >/dev/null || exit 1"]
      interval: 20s
      timeout: 8s
      start_period: 120s
      retries: 12

volumes:
  jenkins_home:
    name: circleguard_jenkins_home
