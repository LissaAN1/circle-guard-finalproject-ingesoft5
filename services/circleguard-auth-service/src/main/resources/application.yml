spring:
  application:
    name: circleguard-auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/circleguard_auth}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  ldap:
    urls: ${SPRING_LDAP_URLS:ldap://localhost:389}
    base: dc=circleguard,dc=edu
    username: ${SPRING_LDAP_USERNAME:cn=admin,dc=circleguard,dc=edu}
    password: ${SPRING_LDAP_PASSWORD:}

jwt:
  secret: ${JWT_SECRET:}
  expiration: 3600000

qr:
  secret: ${QR_SECRET:}
  expiration: 300

server:
  port: 8180

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

identity:
  api:
    url: ${IDENTITY_API_URL:http://localhost:8083}
