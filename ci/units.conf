# HU-04 pipeline units: <unit> <kind> <tests>
#   kind  : service (Gradle module + Dockerfile) | client (Expo web client, Docker only)
#   tests : enforce = failing tests fail the build
#           report  = failing tests mark the build UNSTABLE (known baseline failure, see docs/operaciones/hallazgos_tecnicos.md)
#           skip    = no tests run
# HU-05: <unit> <kind> <tests> [quality]
#   quality : gate = analysed by SonarQube; the build fails (and nothing is packaged) if the quality gate fails
#             none = not analysed (default when the column is omitted)
auth          service  enforce  gate
identity      service  enforce  gate
promotion     service  enforce  gate
notification  service  enforce  none
form          service  enforce  gate
file          service  enforce  none
gateway       service  enforce  gate
dashboard     service  enforce  none
web           client   skip     none
